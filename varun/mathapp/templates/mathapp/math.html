<!DOCTYPE html>
<html>
<head>
    <title>GST Bill Calculator</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#333;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        #result{
            margin-top:15px;
            text-align:center;
            font-size:20px;
            color:blue;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GST Bill Calculator</h2>

    <label>Price (₹)</label>
    <input type="number" id="price" placeholder="Enter Price">

    <label>GST (%)</label>
    <input type="number" id="gst" placeholder="Enter GST Percentage">

    <button onclick="calculateBill()">Calculate</button>

    <div id="result"></div>
</div>

<script>
function calculateBill()
{
    let price = parseFloat(document.getElementById("price").value);
    let gst = parseFloat(document.getElementById("gst").value);

    let total = price + (price * gst / 100);

    document.getElementById("result").innerHTML =
        "Total Bill Amount = ₹ " + total.toFixed(2);
}
</script>

</body>
</html>
